<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Code · RSVP</title>
<style>
  :root{color-scheme:dark;--text-primary:#e8e6e1;--text-secondary:#8a8f98;--border-strong:#2a2e36;--surface-1:#171a20;--text-accent:#6aa8ff}
  body{margin:0;background:#0f1115;color:var(--text-primary);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{max-width:820px;margin:0 auto;padding:16px 16px 0;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-secondary)}
  header .dot{width:8px;height:8px;border-radius:50%;background:#555}
  header .dot.on{background:#3fb950}
  header label{margin-left:auto;display:flex;gap:6px;align-items:center}
  main{max-width:820px;margin:0 auto;padding:12px 16px 32px}
  .empty{color:var(--text-secondary);text-align:center;padding:60px 0}
</style>
</head>
<body>
<header><span class="dot" id="dot"></span><span id="status">Connecting…</span><label><input type="checkbox" id="auto" checked> Autoplay new replies</label></header>
<main id="host"><div class="empty" id="empty">Waiting for Claude Code's next reply</div></main>
<script src="/rsvp.min.js"></script>
<script>
  const host = document.getElementById('host');
  const auto = document.getElementById('auto');
  try { auto.checked = localStorage.getItem('rsvp-autoplay') !== '0'; } catch {}
  auto.addEventListener('change', () => { try { localStorage.setItem('rsvp-autoplay', auto.checked ? '1' : '0'); } catch {} });

  let player = null;
  function show(text, autoplay) {
    document.getElementById('empty')?.remove();
    if (!player) player = RSVPReader.mount(host, text);
    else player.load(text);
    if (autoplay) player.play();
    document.title = 'Claude Code · RSVP';
  }

  fetch('/latest').then(r => r.json()).then(l => { if (l && l.text && !player) show(l.text, false); }).catch(() => {});

  const setStatus = (on, msg) => {
    document.getElementById('dot').classList.toggle('on', on);
    document.getElementById('status').textContent = msg;
  };
  const es = new EventSource('/events');
  es.onopen = () => setStatus(true, 'Live: new Claude Code replies appear here');
  es.onerror = () => setStatus(false, 'Disconnected. The reader server has stopped; it restarts with the next reply.');
  es.onmessage = e => { const { text } = JSON.parse(e.data); show(text, auto.checked); };
</script>
</body>
</html>
